name: Vision CI

on:
  pull_request:
  push:
    branches: [main, vision-foundation]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install numpy pydantic pytest
      - name: Run tests
        run: pytest -q
      - name: Compile Python files
        run: python -m compileall dataset-builder vision-engine kaggle
